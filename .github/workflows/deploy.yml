name: Build and deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler: "2.6.9"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install image converter and locked Node dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y imagemagick
          npm ci
      - run: npm run format:check
      - run: npm test
      - name: Build, optimize and verify the site
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.sha }}
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the artifact that passed verification
        uses: actions/download-artifact@v8
        with:
          name: site-${{ github.sha }}
          path: _site/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
