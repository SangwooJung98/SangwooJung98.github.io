title: blank
first_name: Sangwoo
last_name: Jung
email: dan0130@snu.ac.kr
description: ""
footer_text: ""
keywords: Radar, LiDAR, SLAM, Legged Robot
lang: en
icon: "⚛️"
url: https://sangwoojung98.github.io
baseurl: ""
navbar_fixed: true
footer_fixed: true
max_width: 800px
github_username: SangwooJung98
linkedin_username: sangwoojung98
scholar_userid: I2pNZDkAAAAJ
instagram_id: sangwoojung98
contact_note: "Please contact me with the Email! \n"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include:
  - _pages
exclude:
  - bin/
  - docs/
  - test/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - vendor/
  - node_modules/
keep_files:
  - CNAME
  - ".nojekyll"
sass:
  style: compressed
  sourcemap: never
scholar:
  last_name:
    - Jung
  first_name:
    - Sangwoo
  style: apa
  locale: en
  source: _bibliography
  bibliography: "papers_*.bib"
  bibliography_international_journals: papers_inter_journal.bib
  bibliography_international_conferences: papers_inter_conf.bib
  bibliography_domestic_journals: papers_domes_journal.bib
  bibliography_thesis: papers_thesis.bib
  bibliography_template: bib
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
filtered_bibtex_keywords:
  - abbr
  - abstract
  - altmetric
  - arxiv
  - bibtex_show
  - blog
  - code
  - cofirst
  - html
  - pdf
  - poster
  - preview
  - selected
  - slides
  - supp
  - video
  - website
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:
imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-quality 85"
enable_darkmode: true
enable_progressbar: true
jquery:
  version: 3.6.0
  integrity: sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=
mdb:
  version: 4.20.0
  integrity:
    css: sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw=
    js: sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=
plugins:
  - jekyll-email-protect
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
  - scope:
      path: pdf
    values:
      sitemap: false
jekyll-minifier:
  exclude:
    - robots.txt
